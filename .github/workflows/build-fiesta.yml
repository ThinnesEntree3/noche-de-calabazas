name: Construir APK Fiesta de Premios

on:
  push:
    branches: [main]
    paths:
      - 'fiesta-app/**'
      - '.github/workflows/build-fiesta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiesta-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../FiestaDePremios.apk

      # Release propia con etiqueta fija: el enlace de descarga no cambia entre versiones
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fiesta
          name: Fiesta de Premios
          make_latest: false
          files: FiestaDePremios.apk
          overwrite_files: true
