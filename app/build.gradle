plugins {
    id 'com.android.application'
}

android {
    namespace 'com.juandiego.nochecalabazas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.juandiego.nochecalabazas'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Llave fija: así cada APK nueva se instala encima de la anterior sin borrar las partidas guardadas
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
